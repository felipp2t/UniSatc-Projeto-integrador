name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "exists=$(test -f server/pom.xml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        if: steps.check.outputs.exists == 'true'
        working-directory: server
        run: mvn -B verify
      - name: Skip (server/pom.xml not found yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "server/pom.xml not found yet, skipping"

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "exists=$(test -f web/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run lint --if-present
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run build --if-present
      - name: Skip (web/package.json not found yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "web/package.json not found yet, skipping"
