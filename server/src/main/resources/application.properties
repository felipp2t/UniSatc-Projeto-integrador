# carrega server/.env (se existir) como fonte de properties — nenhum segredo fica com default aqui
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.application.name=rootly-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rootly}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

invite.expiration-ms=604800000
password-reset.expiration-ms=3600000

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.mail.from=${MAIL_FROM:no-reply@rootly.com}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
