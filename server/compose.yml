services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vaulty
      POSTGRES_USER: vaulty
      POSTGRES_PASSWORD: vaulty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaulty -d vaulty"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.3
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY em server/.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY em server/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
