services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vaulty
      POSTGRES_USER: vaulty
      POSTGRES_PASSWORD: vaulty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaulty -d vaulty"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
